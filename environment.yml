# conda env for the StressGuard track (CPU). Build: conda env create -p /home/sudingli/cq-home/stressguard/env -f environment.stressguard.yml
name: stressguard
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.4.1
      - numpy<2
      - pandas>=2.0
      - scipy>=1.10
      - scikit-learn>=1.3
      - pyyaml>=6.0
      - matplotlib>=3.7
      - tabulate>=0.9
